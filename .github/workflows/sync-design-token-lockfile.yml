name: Sync Design Token Lockfile

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/sync-design-token-lockfile.yml"

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.head_ref == 'design/token-governance-hardening' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git commit -m "chore(lockfile): sync design-system workspace"
          git push origin HEAD:${{ github.head_ref }}
