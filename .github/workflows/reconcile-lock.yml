name: Temporary Coach Lockfile Reconciliation

on:
  push:
    branches: [reconcile/coach-67]

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, 'chore(lock): reconcile Coach workspace') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconcile/coach-67
      - uses: pnpm/action-setup@v4
        with:
          version: 10.3.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Reconcile lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already reconciled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(lock): reconcile Coach workspace"
          git push origin HEAD:reconcile/coach-67
