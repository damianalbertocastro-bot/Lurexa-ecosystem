name: Verify Learn Web Vercel Build

on:
  push:
    branches:
      - fix/vercel-learn-web-build

jobs:
  verify-learn-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck learn-web
        run: pnpm --filter learn-web check-types

      - name: Build learn-web
        run: pnpm --filter learn-web build
