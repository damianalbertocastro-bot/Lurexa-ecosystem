name: CI (Phase 0 Lock)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Foundation & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java 21 for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Brand System
        run: pnpm verify:brand-system

      - name: Verify Product Registry Consumers
        run: pnpm verify:product-registry

      - name: Verify Linguistic Intelligence
        run: pnpm verify:linguistic-intelligence

      - name: Verify Learner Model Architecture
        run: pnpm verify:learner-model

      - name: Verify Mind Recommendations
        run: pnpm verify:mind-recommendations

      - name: Verify Learn Firestore Security Rules
        run: pnpm test:learn-rules

      - name: Verify Phase 0
        run: pnpm verify:phase0
