name: Product Deployment Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: product-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected deployment surfaces
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ecosystem: ${{ steps.filter.outputs.ecosystem }}
      learn_web: ${{ steps.filter.outputs.learn_web }}
      teach: ${{ steps.filter.outputs.teach }}
      admin: ${{ steps.filter.outputs.admin }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ecosystem:
              - 'apps/web/**'
              - 'packages/**'
              - 'tooling/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            learn_web:
              - 'apps/learn-web/**'
              - 'packages/**'
              - 'tooling/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            teach:
              - 'apps/teach-web/**'
              - 'packages/**'
              - 'tooling/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            admin:
              - 'apps/admin-portal/**'
              - 'packages/**'
              - 'tooling/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            docs:
              - 'apps/docs/**'
              - 'packages/**'
              - 'tooling/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'

  ecosystem:
    name: Ecosystem Web
    needs: changes
    if: needs.changes.outputs.ecosystem == 'true'
    uses: ./.github/workflows/product-check.yml
    with:
      workspace: web

  learn-web:
    name: Lurexa Learn Web
    needs: changes
    if: needs.changes.outputs.learn_web == 'true'
    uses: ./.github/workflows/product-check.yml
    with:
      workspace: learn-web

  teach:
    name: Lurexa Teach Web
    needs: changes
    if: needs.changes.outputs.teach == 'true'
    uses: ./.github/workflows/product-check.yml
    with:
      workspace: '@lurexa/teach-web'
      optional: true

  admin:
    name: Lurexa Admin
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    uses: ./.github/workflows/product-check.yml
    with:
      workspace: admin-portal

  docs:
    name: Lurexa Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/product-check.yml
    with:
      workspace: docs
