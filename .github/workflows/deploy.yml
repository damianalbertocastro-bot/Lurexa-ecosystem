name: Product Deployment Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      surface:
        description: 'Target surface to deploy (or "all" for all surfaces)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - ecosystem-web
          - learn-web
          - coach-web
          - teach-web
          - admin-web
          - docs-web
          - insight-web
          - studio-web

concurrency:
  group: product-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Detect affected deployment surfaces
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ecosystem: ${{ steps.filter.outputs.ecosystem }}
      learn_web: ${{ steps.filter.outputs.learn_web }}
      coach: ${{ steps.filter.outputs.coach }}
      teach: ${{ steps.filter.outputs.teach }}
      admin: ${{ steps.filter.outputs.admin }}
      docs: ${{ steps.filter.outputs.docs }}
      insight: ${{ steps.filter.outputs.insight }}
      studio: ${{ steps.filter.outputs.studio }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ecosystem:
              - 'apps/web/**'
              - 'packages/**'
              - 'tooling/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            learn_web:
              - 'apps/learn-web/**'
              - 'packages/**'
              - 'tooling/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            coach:
              - 'apps/coach-web/**'
              - 'packages/**'
              - 'tooling/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            teach:
              - 'apps/teach-web/**'
              - 'packages/**'
              - 'tooling/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            admin:
              - 'apps/admin-portal/**'
              - 'packages/**'
              - 'tooling/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            docs:
              - 'apps/docs/**'
              - 'packages/**'
              - 'tooling/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            insight:
              - 'apps/insight-web/**'
              - 'packages/**'
              - 'tooling/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            studio:
              - 'apps/studio-web/**'
              - 'packages/**'
              - 'tooling/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'

  ecosystem:
    name: Ecosystem Web
    needs: changes
    if: needs.changes.outputs.ecosystem == 'true'
    uses: ./.github/workflows/product-check.yml
    with:
      workspace: web

  learn-web:
    name: Lurexa Learn Web
    needs: changes
    if: needs.changes.outputs.learn_web == 'true'
    uses: ./.github/workflows/product-check.yml
    with:
      workspace: learn-web

  coach:
    name: Lurexa Coach Web
    needs: changes
    if: needs.changes.outputs.coach == 'true'
    uses: ./.github/workflows/product-check.yml
    with:
      workspace: '@lurexa/coach-web'

  teach:
    name: Lurexa Teach Web
    needs: changes
    if: needs.changes.outputs.teach == 'true'
    uses: ./.github/workflows/product-check.yml
    with:
      workspace: '@lurexa/teach-web'
      optional: true

  admin:
    name: Lurexa Admin
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    uses: ./.github/workflows/product-check.yml
    with:
      workspace: admin-portal

  docs:
    name: Lurexa Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/product-check.yml
    with:
      workspace: docs

  insight:
    name: Lurexa Insight Web
    needs: changes
    if: needs.changes.outputs.insight == 'true'
    uses: ./.github/workflows/product-check.yml
    with:
      workspace: '@lurexa/insight-web'

  studio:
    name: Lurexa Studio Web
    needs: changes
    if: needs.changes.outputs.studio == 'true'
    uses: ./.github/workflows/product-check.yml
    with:
      workspace: '@lurexa/studio-web'

  preview-deployment:
    name: Cloudflare Preview Deployments
    needs: [changes]
    if: github.event_name == 'pull_request' && (needs.changes.outputs.learn_web == 'true' || needs.changes.outputs.coach == 'true' || needs.changes.outputs.teach == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.3.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Cloudflare readiness
        run: pnpm verify:cloudflare

      - name: Deploy Lurexa Learn Preview
        if: needs.changes.outputs.learn_web == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "🚀 Deploying learn-web to Cloudflare Preview..."
            node scripts/deploy-cloudflare.mjs --surface learn-web --target preview --deploy
          else
            echo "⚠ CLOUDFLARE_API_TOKEN not present in secrets; simulating preview deployment..."
            node scripts/deploy-cloudflare.mjs --surface learn-web --target preview --dry-run
          fi

      - name: Deploy Lurexa Coach Preview
        if: needs.changes.outputs.coach == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "🚀 Deploying coach-web to Cloudflare Preview..."
            node scripts/deploy-cloudflare.mjs --surface coach-web --target preview --deploy
          else
            echo "⚠ CLOUDFLARE_API_TOKEN not present in secrets; simulating preview deployment..."
            node scripts/deploy-cloudflare.mjs --surface coach-web --target preview --dry-run
          fi

      - name: Deploy Lurexa Teach Preview
        if: needs.changes.outputs.teach == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "🚀 Deploying teach-web to Cloudflare Preview..."
            node scripts/deploy-cloudflare.mjs --surface teach-web --target preview --deploy
          else
            echo "⚠ CLOUDFLARE_API_TOKEN not present in secrets; simulating preview deployment..."
            node scripts/deploy-cloudflare.mjs --surface teach-web --target preview --dry-run
          fi

      - name: Comment Preview URLs on Pull Request
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            try {
              const learn = '${{ needs.changes.outputs.learn_web }}' === 'true';
              const coach = '${{ needs.changes.outputs.coach }}' === 'true';
              const teach = '${{ needs.changes.outputs.teach }}' === 'true';

              let message = '### 🌐 Lurexa Cloudflare Preview Deployments\n\n';
              message += '| Surface | Worker Name | Preview URL |\n';
              message += '| :--- | :--- | :--- |\n';
              if (learn) {
                message += '| **Lurexa Learn** | `lurexa-learn-preview` | https://lurexa-learn-preview.damianalbertocastro.workers.dev |\n';
              }
              if (coach) {
                message += '| **Lurexa Coach** | `lurexa-coach-preview` | https://lurexa-coach-preview.damianalbertocastro.workers.dev |\n';
              }
              if (teach) {
                message += '| **Lurexa Teach** | `lurexa-teach-preview` | https://lurexa-teach-preview.damianalbertocastro.workers.dev |\n';
              }
              message += '\n*Preview deployments allow isolated end-to-end testing before merging to production.*';

              const header = '### 🌐 Lurexa Cloudflare Preview Deployments';
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const existing = comments.find((c) => c.body && c.body.includes(header));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: message,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: message,
                });
              }
            } catch (err) {
              console.log('Notice: Could not post PR comment (e.g. fork PR permissions):', err.message);
            }

  production-deployment:
    name: Cloudflare Production Deployments
    needs: [changes, ecosystem, learn-web, coach, teach, admin, docs, insight, studio]
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.ecosystem == 'true' ||
        needs.changes.outputs.learn_web == 'true' ||
        needs.changes.outputs.coach == 'true' ||
        needs.changes.outputs.teach == 'true' ||
        needs.changes.outputs.admin == 'true' ||
        needs.changes.outputs.docs == 'true' ||
        needs.changes.outputs.insight == 'true' ||
        needs.changes.outputs.studio == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.3.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Cloudflare readiness
        run: pnpm verify:cloudflare

      - name: Deploy Ecosystem Web Production
        if: |
          needs.changes.outputs.ecosystem == 'true' ||
          (github.event_name == 'workflow_dispatch' && (inputs.surface == 'all' || inputs.surface == 'ecosystem-web'))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "🚀 Deploying ecosystem-web (lurexa-web) to Cloudflare Production..."
            node scripts/deploy-cloudflare.mjs --surface ecosystem-web --target production --deploy
          else
            echo "⚠ CLOUDFLARE_API_TOKEN not present in secrets; simulating production deployment..."
            node scripts/deploy-cloudflare.mjs --surface ecosystem-web --target production --dry-run
          fi

      - name: Deploy Lurexa Learn Production
        if: |
          needs.changes.outputs.learn_web == 'true' ||
          (github.event_name == 'workflow_dispatch' && (inputs.surface == 'all' || inputs.surface == 'learn-web'))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "🚀 Deploying learn-web (lurexa-learn) to Cloudflare Production..."
            node scripts/deploy-cloudflare.mjs --surface learn-web --target production --deploy
          else
            echo "⚠ CLOUDFLARE_API_TOKEN not present in secrets; simulating production deployment..."
            node scripts/deploy-cloudflare.mjs --surface learn-web --target production --dry-run
          fi

      - name: Deploy Lurexa Coach Production
        if: |
          needs.changes.outputs.coach == 'true' ||
          (github.event_name == 'workflow_dispatch' && (inputs.surface == 'all' || inputs.surface == 'coach-web'))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "🚀 Deploying coach-web (lurexa-coach) to Cloudflare Production..."
            node scripts/deploy-cloudflare.mjs --surface coach-web --target production --deploy
          else
            echo "⚠ CLOUDFLARE_API_TOKEN not present in secrets; simulating production deployment..."
            node scripts/deploy-cloudflare.mjs --surface coach-web --target production --dry-run
          fi

      - name: Deploy Lurexa Teach Production
        if: |
          needs.changes.outputs.teach == 'true' ||
          (github.event_name == 'workflow_dispatch' && (inputs.surface == 'all' || inputs.surface == 'teach-web'))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "🚀 Deploying teach-web (lurexa-teach) to Cloudflare Production..."
            node scripts/deploy-cloudflare.mjs --surface teach-web --target production --deploy
          else
            echo "⚠ CLOUDFLARE_API_TOKEN not present in secrets; simulating production deployment..."
            node scripts/deploy-cloudflare.mjs --surface teach-web --target production --dry-run
          fi

      - name: Deploy Lurexa Admin Production
        if: |
          needs.changes.outputs.admin == 'true' ||
          (github.event_name == 'workflow_dispatch' && (inputs.surface == 'all' || inputs.surface == 'admin-web'))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "🚀 Deploying admin-web (lurexa-admin) to Cloudflare Production..."
            node scripts/deploy-cloudflare.mjs --surface admin-web --target production --deploy
          else
            echo "⚠ CLOUDFLARE_API_TOKEN not present in secrets; simulating production deployment..."
            node scripts/deploy-cloudflare.mjs --surface admin-web --target production --dry-run
          fi

      - name: Deploy Lurexa Docs Production
        if: |
          needs.changes.outputs.docs == 'true' ||
          (github.event_name == 'workflow_dispatch' && (inputs.surface == 'all' || inputs.surface == 'docs-web'))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "🚀 Deploying docs-web (lurexa-docs) to Cloudflare Production..."
            node scripts/deploy-cloudflare.mjs --surface docs-web --target production --deploy
          else
            echo "⚠ CLOUDFLARE_API_TOKEN not present in secrets; simulating production deployment..."
            node scripts/deploy-cloudflare.mjs --surface docs-web --target production --dry-run
          fi

      - name: Deploy Lurexa Insight Production
        if: |
          needs.changes.outputs.insight == 'true' ||
          (github.event_name == 'workflow_dispatch' && (inputs.surface == 'all' || inputs.surface == 'insight-web'))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "🚀 Deploying insight-web (lurexa-insight) to Cloudflare Production..."
            node scripts/deploy-cloudflare.mjs --surface insight-web --target production --deploy
          else
            echo "⚠ CLOUDFLARE_API_TOKEN not present in secrets; simulating production deployment..."
            node scripts/deploy-cloudflare.mjs --surface insight-web --target production --dry-run
          fi

      - name: Deploy Lurexa Studio Production
        if: |
          needs.changes.outputs.studio == 'true' ||
          (github.event_name == 'workflow_dispatch' && (inputs.surface == 'all' || inputs.surface == 'studio-web'))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "🚀 Deploying studio-web (lurexa-studio) to Cloudflare Production..."
            node scripts/deploy-cloudflare.mjs --surface studio-web --target production --deploy
          else
            echo "⚠ CLOUDFLARE_API_TOKEN not present in secrets; simulating production deployment..."
            node scripts/deploy-cloudflare.mjs --surface studio-web --target production --dry-run
          fi

      - name: Production Deployment Summary
        if: always()
        run: |
          echo "### 🚀 Cloudflare Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Surface | Worker Name | Production Domain | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Lurexa Web** | \`lurexa-web\` | https://lurexa.org | ${{ (needs.changes.outputs.ecosystem == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.surface == 'all' || inputs.surface == 'ecosystem-web'))) && '✅ Deployed' || '⚪ Skipped (No changes)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Lurexa Learn** | \`lurexa-learn\` | https://learn.lurexa.org | ${{ (needs.changes.outputs.learn_web == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.surface == 'all' || inputs.surface == 'learn-web'))) && '✅ Deployed' || '⚪ Skipped (No changes)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Lurexa Coach** | \`lurexa-coach\` | https://coach.lurexa.org | ${{ (needs.changes.outputs.coach == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.surface == 'all' || inputs.surface == 'coach-web'))) && '✅ Deployed' || '⚪ Skipped (No changes)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Lurexa Teach** | \`lurexa-teach\` | https://teach.lurexa.org | ${{ (needs.changes.outputs.teach == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.surface == 'all' || inputs.surface == 'teach-web'))) && '✅ Deployed' || '⚪ Skipped (No changes)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Lurexa Admin** | \`lurexa-admin\` | https://admin.lurexa.org | ${{ (needs.changes.outputs.admin == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.surface == 'all' || inputs.surface == 'admin-web'))) && '✅ Deployed' || '⚪ Skipped (No changes)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Lurexa Docs** | \`lurexa-docs\` | https://docs.lurexa.org | ${{ (needs.changes.outputs.docs == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.surface == 'all' || inputs.surface == 'docs-web'))) && '✅ Deployed' || '⚪ Skipped (No changes)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Lurexa Insight** | \`lurexa-insight\` | https://insight.lurexa.org | ${{ (needs.changes.outputs.insight == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.surface == 'all' || inputs.surface == 'insight-web'))) && '✅ Deployed' || '⚪ Skipped (No changes)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Lurexa Studio** | \`lurexa-studio\` | https://studio.lurexa.org | ${{ (needs.changes.outputs.studio == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.surface == 'all' || inputs.surface == 'studio-web'))) && '✅ Deployed' || '⚪ Skipped (No changes)' }} |" >> $GITHUB_STEP_SUMMARY

