name: Learn Web Production Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-learn-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.3.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Workspace Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type Check Learn Web
        run: pnpm --filter learn-web check-types

      - name: Build Learn Web
        run: pnpm --filter learn-web build

# Production deployment is intentionally handled by Vercel's Git integration.
# Vercel watches main and deploys the repository using vercel.json after this push.
