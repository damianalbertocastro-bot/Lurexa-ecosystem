name: Apply Coach PR Lint Corrections

on:
  push:
    branches: [feat/coach-first-class-web]

permissions:
  contents: write

concurrency:
  group: coach-lint-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply precise lint-safe edits
        shell: python
        run: |
          from pathlib import Path

          coach = Path("apps/coach-web/app/page.tsx")
          text = coach.read_text()
          text = text.replace("Coach is Lurexa's dedicated speaking product", "Coach is Lurexa&apos;s dedicated speaking product")
          coach.write_text(text)

          for target in [
              Path("apps/learn-web/app/teacher/billing/page.tsx"),
              Path("apps/learn-web/app/teacher/students/page.tsx"),
          ]:
              text = target.read_text()
              text = text.replace('import { useRouter } from "next/navigation";\n', '')
              text = text.replace('  const router = useRouter();\n', '')
              target.write_text(text)

          banner = Path("apps/learn-web/app/teacher/components/TeacherWorkspaceBanner.tsx")
          text = banner.read_text()
          text = text.replace('  const [greeting, setGreeting] = useState(getGreeting);', '  const greeting = getGreeting();')
          text = text.replace('    // Re-derive the greeting client-side to avoid hydration mismatch.\n    setGreeting(getGreeting());\n\n', '')
          banner.write_text(text)
      - name: Commit fixes when changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No lint corrections needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/coach-web/app/page.tsx apps/learn-web/app/teacher/billing/page.tsx apps/learn-web/app/teacher/students/page.tsx apps/learn-web/app/teacher/components/TeacherWorkspaceBanner.tsx
          git commit -m "fix: clear Coach and Learn lint blockers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
